<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pearl — study notes</title>
<meta name="theme-color" content="#1a3a5c">
<meta name="apple-mobile-web-app-title" content="Pearl">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231a3a5c'/><circle cx='50' cy='54' r='26' fill='%23ffffff'/><circle cx='42' cy='46' r='9' fill='%23dfe6ee'/></svg>">
<link rel="stylesheet" href="pearl.css">
</head>
<body>
<header class="top wrap">
  <div class="brand">
    <svg viewBox="0 0 100 100" width="30" height="30" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#1a3a5c"/><circle cx="50" cy="54" r="26" fill="#fff"/><circle cx="42" cy="46" r="9" fill="#dfe6ee"/></svg>
    <h1>Pearl</h1>
    <span class="sub">study notes</span>
  </div>
  <div class="count" id="count"></div>
</header>

<div class="searchbar">
  <div class="wrap">
    <input id="q" type="search" placeholder="Search titles, keywords, text…" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Search entries">
    <div class="chips" id="chips"></div>
    <details id="tocm" class="tocm">
      <summary>Contents</summary>
      <div id="tocm-list"></div>
    </details>
  </div>
</div>

<div class="layout wrap">
  <nav id="toc" class="toc" aria-label="Table of contents"></nav>
  <div class="maincol">
    <main id="list"></main>
    <p class="empty" id="empty" hidden>No entries match.</p>
  </div>
</div>

<footer class="wrap foot">
  <span>Add entries with <span class="code">/pearls</span> in Claude Code — no API, no cost.</span>
  <span>
    <a href="https://maxweiss10.github.io/whitebook/pdfjs/web/viewer.html?file=../../whitebook.pdf" target="_blank" rel="noopener">White Book ↗</a>
    &nbsp;·&nbsp;
    <a href="https://docs.google.com/document/d/1N8egmcK1GHmA6VPiwi2uGR71VcNt8Ve-M-tMkczFMjc/edit" target="_blank" rel="noopener">Legacy doc archive ↗</a>
  </span>
</footer>

<script src="app.js"></script>
</body>
</html>
